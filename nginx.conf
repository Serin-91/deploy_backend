server {
    listen 80;
    server_name 54.117.156.17;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://54.117.156.17$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 54.117.156.17;

    ssl_certificate /etc/letsencrypt/live/ec2-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ec2-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
